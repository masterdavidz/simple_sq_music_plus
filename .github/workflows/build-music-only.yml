name: build-music-only

# 上游更新后不需要同步 fork：这里直接检出上游源码，打补丁后构建。
# 触发方式：手动 / 每周一自动 / 改到 patches 目录时自动。
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游分支或 tag"
        required: true
        default: "3.0"
  schedule:
    - cron: "0 18 * * 0"        # 每周一 02:00（北京时间）自动构建一次
  push:
    branches: [ "3.0" ]
    paths:
      - "patches/**"
      - ".github/workflows/build-music-only.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
      ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
    steps:
      - name: 取出补丁
        uses: actions/checkout@v4
        with:
          path: patch

      - name: 检出上游源码
        uses: actions/checkout@v4
        with:
          repository: 59799517/simple_sq_music_plus
          ref: ${{ inputs.upstream_ref || '3.0' }}
          path: upstream
          fetch-depth: 1

      - name: 应用补丁
        run: |
          git -C upstream apply --verbose --whitespace=nowarn \
            "$GITHUB_WORKSPACE/patch/patches/music-only.patch"

      - name: 读取版本号
        id: v
        run: |
          V=$(grep -m1 '^version:' upstream/src/main/resources/application.yml | awk '{print $2}' | tr -d '"')
          S=$(git -C upstream rev-parse --short HEAD)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "sha=$S" >> "$GITHUB_OUTPUT"
          echo "上游版本：$V（commit $S）" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: upstream/pom.xml

      - name: Maven 打包
        working-directory: upstream
        run: mvn -B -DskipTests package

      - name: 构建镜像
        run: |
          docker build -t sqmusic:music-only \
            -f upstream/Dockerfile \
            --build-arg JAR_FILE=target/simple_sq_music_plus.jar \
            upstream
          GHCR="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker tag sqmusic:music-only "${GHCR}:music-only"
          docker tag sqmusic:music-only "${GHCR}:music-only-${{ steps.v.outputs.version }}"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送 GHCR
        run: |
          GHCR="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker push "${GHCR}:music-only"
          docker push "${GHCR}:music-only-${{ steps.v.outputs.version }}"

      - name: 登录阿里云 ACR
        if: env.ALIYUN_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_USER }}
          password: ${{ env.ALIYUN_PASSWORD }}

      - name: 推送阿里云 ACR
        if: env.ALIYUN_REGISTRY != ''
        run: |
          IMAGE="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/simple_sq_music_plus"
          docker tag sqmusic:music-only "${IMAGE}:music-only"
          docker tag sqmusic:music-only "${IMAGE}:music-only-${{ steps.v.outputs.version }}"
          docker push "${IMAGE}:music-only"
          docker push "${IMAGE}:music-only-${{ steps.v.outputs.version }}"
          echo "阿里云：${IMAGE}:music-only-${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
