name: build-music-only

# 在你自己 fork 的仓库里运行：push 到 3.0 分支或手动触发
on:
  push:
    branches: [ "3.0" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 放进 job 级 env，才能安全地在 if 里判断“有没有配置阿里云”
    env:
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
      ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算小写镜像名
        id: img
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Maven 打包
        run: mvn -B -DskipTests package

      - name: 构建镜像（只构建一次）
        run: |
          docker build -t sqmusic:music-only \
            --build-arg JAR_FILE=target/simple_sq_music_plus.jar .
          docker tag sqmusic:music-only "ghcr.io/${{ steps.img.outputs.name }}:music-only"
          docker tag sqmusic:music-only "ghcr.io/${{ steps.img.outputs.name }}:music-only-${{ github.sha }}"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送 GHCR
        run: |
          docker push "ghcr.io/${{ steps.img.outputs.name }}:music-only"
          docker push "ghcr.io/${{ steps.img.outputs.name }}:music-only-${{ github.sha }}"

      # ---------------------------------------------------------------------
      # 阿里云 ACR：需要在仓库 Settings → Secrets 里配置下面 4 个值才会执行
      #   ALIYUN_REGISTRY   = registry.cn-hangzhou.aliyuncs.com
      #   ALIYUN_USER       = 阿里云账号全名（如 xxx@xxx.com）
      #   ALIYUN_PASSWORD   = ACR「访问凭证」里设置的固定密码
      #   ALIYUN_NAMESPACE  = ACR 的命名空间（如 sqmusic）
      # 没配这几个 secret 时，下面两步会自动跳过，不会让整个构建失败。
      # ---------------------------------------------------------------------
      - name: 登录阿里云 ACR
        if: env.ALIYUN_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_USER }}
          password: ${{ env.ALIYUN_PASSWORD }}

      - name: 推送阿里云 ACR
        if: env.ALIYUN_REGISTRY != ''
        run: |
          IMAGE="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/simple_sq_music_plus"
          docker tag sqmusic:music-only "${IMAGE}:music-only"
          docker tag sqmusic:music-only "${IMAGE}:music-only-${GITHUB_SHA}"
          docker push "${IMAGE}:music-only"
          docker push "${IMAGE}:music-only-${GITHUB_SHA}"
          echo "阿里云镜像：${IMAGE}:music-only" >> "$GITHUB_STEP_SUMMARY"
